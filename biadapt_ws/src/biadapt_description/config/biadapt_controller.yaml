controller_manager:
  ros__parameters:
    update_rate: 100

    joint_state_broadcaster:
      type: joint_state_broadcaster/JointStateBroadcaster

    diff_drive_controller:
      type: diff_drive_controller/DiffDriveController

    left_arm_controller:
      type: joint_trajectory_controller/JointTrajectoryController
    
    right_arm_controller:
      type: joint_trajectory_controller/JointTrajectoryController
    
    left_gripper_finger_l_controller:
      type: parallel_gripper_action_controller/GripperActionController

diff_drive_controller:
  ros__parameters:
    left_wheel_names: ["left_wheel_joint"]
    right_wheel_names: ["right_wheel_joint"]
    wheel_separation: 0.4
    wheel_radius: 0.075
    cmd_vel_timeout: 0.5
    pose_covariance_diagonal: [0.001, 0.001, 0.001, 0.001, 0.001, 0.01]
    twist_covariance_diagonal: [0.001, 0.001, 0.001, 0.001, 0.001, 0.01]

right_arm_controller:
  ros__parameters:
    joints: ["right_shoulder_pan_joint", "right_shoulder_lift_joint", "right_elbow_joint",
             "right_wrist_1_joint", "right_wrist_2_joint", "right_wrist_3_joint"]
    command_interfaces: ["position"]
    state_interfaces: ["position", "velocity"]
  
left_arm_controller:
  ros__parameters:
    joints: ["left_shoulder_pan_joint", "left_shoulder_lift_joint", "left_elbow_joint",
            "left_wrist_1_joint", "left_wrist_2_joint", "left_wrist_3_joint"]
    command_interfaces: ["position"]
    state_interfaces: ["position", "velocity"]

left_gripper_finger_l_controller:
  ros__parameters:
    joint: left_gripper_finger_l_joint
    state_interfaces: ["position", "velocity"]