# robo agent preset 组合: 机器人任务 agent(设计 §10.4).
#
# 组成:
#   1. persona: 「感知末端状态(仅 ready), 自适应决策, 不做低层控制, 不感知末端型号」.
#   2. 臂管理器(robo-arm-manager, 树外包包形态): 预建 armA/armB 作用域 + arm_status/take_object 工具.
#   3. robo-observer(preset 自带文件, 相对路径): 订阅 tools/change 汇报能力集.
#   4. skills/: 机器人能力自适应技能, 随 preset 走.
#
# 本组合不含能力包行: 末端装配由能力挂载体系负责(面板 -> 挂载服务 -> 臂作用域), preset 只感知与执行.
# 安装: install.sh 复制本目录到 $DSH_HOME/.agent-presets/robo, 并把臂管理器包装进 profile
# 的 node_modules, 同时替换臂管理器行的 __ARM_MANAGER__ 占位.

# ── persona ─────────────────────────────────────────────────────────────────

- id: persona
  name: '@deepseek-ai/dsh-persona'
  config:
    text: |-
      你是机器人任务 agent(robo), 运行在 DeepSeek Harness, 工作目录 {{cwd}}. 你面向具身机器人, 负责感知与决策, 不做低层控制.

      核心原则: 感知末端状态, 自适应决策, 不做低层控制, 不感知末端型号.
      - 你不控制也不感知末端型号: 末端执行器由人在运行时热插拔(经 web 面板), 是外部事实; 你只通过 arm_status 感知某条臂是否具备可用末端(ready), 不知道也无需知道是夹爪还是吸盘.
      - 每次执行前先感知: 调 arm_status(arm). ready=true 才调 take_object(arm) 执行; ready=false 按返回的 reason 如实报告, 绝不假装成功.
      - 对同一句命令自适应: 同一句「抓小球」, 末端换型后实例内部自动换策略, 你的决策面始终只有 ready 一个布尔.
      - 不做低层控制: 只调 arm_status 与 take_object; 挂载/卸载末端是面板(人)的职责, 你没有该权限, 也没有该工具.
      - 汇报时说明: 感知到什么(哪条臂 ready 与否)、做了什么(take_object 结果).

# ── agent 指令压缩 ──────────────────────────────────────────────────────────

- id: agent-instructions
  name: '@deepseek-ai/dsh-agent-instructions'
  config:
    maxBytes: 65536

# ── 通用工具(宿主服务, 只注册工具, 不需要 realm) ──────────────────────────

- id: tool-ask-user
  name: '@deepseek-ai/dsh-tool-ask-user'

- id: tool-skill
  name: '@deepseek-ai/dsh-tool-skill'

- id: skill-filesystem
  name: '@deepseek-ai/dsh-skill-filesystem'
  config:
    customSkillDirs:
      - !!js "process.getBuiltinModule('node:url').fileURLToPath(new URL('skills/', baseUrl))"

# ── 臂管理器(设计 §7.1 层 1/2, 树外包包形态) ───────────────────────────────

- id: robo-arm-manager
  name: '__ARM_MANAGER__/src/index.js'
  config:
    # 仓库根(找 bridge_client.py)与 venv python(有 roslibpy).
    workdir: /root/my-project/ros-hotplug-by-dsh
    python: /root/venvs/robo/bin/python3

# ── 观测插件(设计 §7.6): 订阅 tools/change 汇报能力集 ───────────────────────

- id: robo-observer
  name: './src/observer.js'
