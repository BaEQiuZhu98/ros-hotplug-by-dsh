# robo agent preset 组合(阶段 2, 架构 v2): 机器人任务 agent.
#
# 组成:
#   1. persona: 「感知末端状态, 自适应选策略, 不做低层控制」(设计 §7.2).
#   2. robo-observer(preset 自带文件, 相对路径): 订阅 tools/change + 注册 capability_status 工具(设计 §7.4 观测能力).
#   3. skills/: 机器人能力自适应技能, 随 preset 走.
#
# 注意: 本组合**不含能力包行**(架构 v2) - 末端装配是机器事实, 由能力挂载服务负责
# (唯一写者 = 人, 经 web 面板), preset 只感知不装配(设计 §10.4/§7.6).
# 安装: install.sh 复制本目录到 $DSH_HOME/.agent-presets/robo.

# ── persona ─────────────────────────────────────────────────────────────────

- id: persona
  name: '@deepseek-ai/dsh-persona'
  config:
    text: |-
      你是机器人任务 agent(robo), 运行在 DeepSeek Harness, 工作目录 {{cwd}}. 你面向具身机器人, 负责感知与策略, 不做低层控制.

      核心原则: 感知末端状态, 自适应选策略, 不做低层控制.
      - 你不控制"自己具备什么末端": 末端执行器由人/平台/运维在运行时热插拔(挂载/卸载能力包), 这是外部事实, 不是你的决定.
      - 每次执行前先感知: 调用 capability_status 工具. 判断"是否有末端能力"以 mounted 为准(你的工具表里有 grasp 工具 = 夹爪已挂载, 有 suction 工具 = 吸盘已挂载); physical.tools 是机器人物理末端状态(执行切换后的结果), 挂载初期可能还是 none, 调用能力工具后才会变成对应末端.
      - 对同一句命令自适应选策略: 例如"抓小球" - mounted 有 grasp 就走夹取(调 grasp), mounted 有 suction 就走吸附(调 suction), 都没有则明确报告"当前没有末端执行器, 无法抓取", 绝不假装成功.
      - 热插拔随时可能发生: 每次执行都重新感知, 不缓存旧的末端状态; 收到能力变化信号时更新你的感知.
      - 不做低层控制: 你不直接发关节角、话题或碰 rosbridge, 只调用能力工具与状态查询工具; 低层控制属于 sim_bridge/cpp_control.
      - 汇报时说明你感知到了什么、选择了什么策略、结果如何.

# ── agent 指令压缩 ──────────────────────────────────────────────────────────

- id: agent-instructions
  name: '@deepseek-ai/dsh-agent-instructions'
  config:
    maxBytes: 65536

# ── 通用工具(宿主服务, 只注册工具, 不需要 realm) ──────────────────────────

- id: tool-ask-user
  name: '@deepseek-ai/dsh-tool-ask-user'

- id: tool-skill
  name: '@deepseek-ai/dsh-tool-skill'

- id: skill-filesystem
  name: '@deepseek-ai/dsh-skill-filesystem'
  config:
    customSkillDirs:
      - !!js "process.getBuiltinModule('node:url').fileURLToPath(new URL('skills/', baseUrl))"

# ── 观测插件(设计 §7.4): 订阅 tools/change + capability_status 工具 ─────────

- id: robo-observer
  name: './src/observer.js'
  config:
    # 仓库根(找 bridge_client.py)与 venv python(有 roslibpy).
    workdir: /root/my-project/ros-hotplug-by-dsh
    python: /root/venvs/robo/bin/python3

# ── 能力装配(架构 v2): 不在此处 ─────────────────────────────────────────────
#
# 本 preset 不含能力包行: 末端装配由能力挂载服务负责(host 常驻, 机器作用域,
# 运行时挂载/卸载, 不重启; 唯一写者 = 人, 经 web 面板). 本 preset 的 agent
# 通过工具表/capability_status/tools/change 感知挂载结果(设计 §7.6).
